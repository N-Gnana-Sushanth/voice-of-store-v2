services:
  - type: web
    name: voice-of-store-backend
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: voice-of-store-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_REQUEST_BODY_BYTES
        value: "2097152"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: INITIAL_ADMIN_EMAIL
        value: "admin@voiceofstore.internal"
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: voice-of-store-db
    databaseName: voice_of_store
    user: store_admin
    plan: free
